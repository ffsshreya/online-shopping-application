
name: Docker CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build -t online-shopping-app:${{ github.sha }} .

      - name: Run container for smoke test
        run: |
          docker run -d --name shopping-test -p 8080:80 online-shopping-app:${{ github.sha }}
          for i in $(seq 1 10); do
            if curl --fail http://localhost:8080/; then
              exit 0
            fi
            sleep 2
          done
          docker logs shopping-test
          exit 1

      - name: Clean up test container
        if: always()
        run: docker rm -f shopping-test || true
